# Requires a repo secret GOKIT_READ_TOKEN: a fine-grained GitHub PAT with
# Contents: read on codetay/go-kit, used below to check out the GO-KIT ref
# this SDK's openapi.json fixture is pinned to (test/fixtures/openapi.lock.json).
name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Read the pinned GO-KIT ref
        id: lock
        run: echo "ref=$(jq -r .gokit_ref test/fixtures/openapi.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: codetay/go-kit
          ref: ${{ steps.lock.outputs.ref }}
          token: ${{ secrets.GOKIT_READ_TOKEN }}
          path: gokit
      - name: Verify the openapi.json fixture against the pinned GO-KIT ref
        run: npm run verify-spec
        env:
          GOKIT_DIR: ${{ github.workspace }}/gokit
      - run: npm test
      - run: npm run typecheck
      # Style and packaging gates run on one leg only, so a regression is
      # reported once instead of once per Node version.
      - name: Package and style gates
        if: matrix.node == '22'
        run: |
          npm run format:check
          npm run check:package
